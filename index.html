<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gehalt & Mietaufteilung</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufteilung">
<style>
:root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: var(--font-sans);
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --font-eyebrow: var(--font-num);
    --font-size: 15px;

    --maxw: 1000px;
    --gutter: 24px;
    --stack-gap: 14px;
    --topbar-pad: 22px;

    --h1-size: 34px; --h1-weight: 800; --h1-track: -0.035em; --h1-auth-size: 28px;
    --h2-size: 11.5px; --h2-weight: 700; --h2-track: 0.1em; --h2-gap: 20px;
    --eyebrow-size: 10.5px; --eyebrow-weight: 500; --eyebrow-track: 0.16em;
    --eyebrow-transform: uppercase; --eyebrow-color: var(--ink-faint);
    --num-weight: 500; --num-track: -0.01em;

    --page-base: #ffffff;
    --page-bg: #ffffff;
    --ink: #0a0a0a;
    --ink-soft: #5c5c5c;
    --ink-faint: #949494;
    --line: rgba(0, 0, 0, 0.1);
    --line-strong: #0a0a0a;

    --accent: #1c48d4;
    --accent-ink: #ffffff;
    --accent-soft: rgba(28, 72, 212, 0.07);
    --accent2: #c2410c;
    --accent2-soft: rgba(194, 65, 12, 0.08);
    --rest: #15803d;
    --rest-soft: rgba(21, 128, 61, 0.08);

    --card-bg: #ffffff;
    --card-border: 1px solid rgba(0, 0, 0, 0.13);
    --card-radius: 3px;
    --card-shadow: none;
    --card-pad: 24px 26px 26px;

    --tile-bg: #ffffff;
    --tile-border: 1px solid rgba(0, 0, 0, 0.13);
    --tile-radius: 3px;
    --tile-shadow: none;
    --tile-pad: 16px 18px 18px;
    --tile-gap: 0px;
    --tile-label-size: 10px; --tile-label-weight: 500; --tile-label-track: 0.14em; --tile-label-transform: uppercase;
    --tile-value-size: 24px;

    --topbar-bg: rgba(255, 255, 255, 0.92);
    --topbar-filter: blur(10px);
    --topbar-border: 1px solid var(--line-strong);

    --switch-bg: transparent;
    --switch-border: 1px solid rgba(0, 0, 0, 0.13);
    --switch-pad: 0;
    --switch-active-bg: #0a0a0a;
    --switch-active-ink: #ffffff;
    --switch-active-shadow: none;

    --field-bg: transparent;
    --field-bg-focus: var(--accent-soft);
    --field-border: 1px solid rgba(0, 0, 0, 0.18);
    --field-radius: 2px;

    --btn-primary-bg: #0a0a0a;
    --btn-primary-ink: #ffffff;
    --btn-radius: 2px;
    --btn-shadow: none;
    --btn-ghost-bg: transparent;
    --btn-ghost-border: 1px solid rgba(0, 0, 0, 0.18);

    --add-bg: transparent;
    --add-border: 1px solid rgba(0, 0, 0, 0.18);

    --bar-h: 22px; --bar-radius: 0; --bar-border: 1px solid var(--line-strong);
    --pill: 2px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    /* Reines Schwarz überall (Seite = Karte = nur 1px Rand als Unterschied)
       wirkte am PC zu hart. Seite jetzt ein dunkles Grau statt Schwarz, Karten
       eine Stufe heller darüber - das gibt echte Tiefe statt einer einzigen
       flachen schwarzen Fläche, und die Augen haben weniger Kontrastsprung
       zur hellen Schrift. */
    --page-base: #141414;
    --page-bg: #141414;
    --ink: #ececec;
    --ink-soft: #a3a3a3;
    --ink-faint: #74746f;
    --line: rgba(255, 255, 255, 0.12);
    --line-strong: rgba(255, 255, 255, 0.28);

    --accent: #7d9bff;
    --accent-ink: #14141a;
    --accent-soft: rgba(125, 155, 255, 0.15);
    --accent2: #ff9463;
    --accent2-soft: rgba(255, 148, 99, 0.15);
    --rest: #5fce8b;
    --rest-soft: rgba(95, 206, 139, 0.15);

    --card-bg: #1c1c1c;
    --card-border: 1px solid rgba(255, 255, 255, 0.1);
    --tile-bg: #1c1c1c;
    --tile-border: 1px solid rgba(255, 255, 255, 0.1);

    --topbar-bg: rgba(20, 20, 20, 0.92);

    --switch-border: 1px solid rgba(255, 255, 255, 0.14);
    --switch-active-bg: #ececec;
    --switch-active-ink: #14141a;

    --field-border: 1px solid rgba(255, 255, 255, 0.18);
    --btn-primary-bg: #ececec;
    --btn-primary-ink: #14141a;
    --btn-ghost-border: 1px solid rgba(255, 255, 255, 0.18);
    --add-border: 1px solid rgba(255, 255, 255, 0.18);
    }
  }
  :root[data-theme="dark"] {
    /* Reines Schwarz überall (Seite = Karte = nur 1px Rand als Unterschied)
       wirkte am PC zu hart. Seite jetzt ein dunkles Grau statt Schwarz, Karten
       eine Stufe heller darüber - das gibt echte Tiefe statt einer einzigen
       flachen schwarzen Fläche, und die Augen haben weniger Kontrastsprung
       zur hellen Schrift. */
    --page-base: #141414;
    --page-bg: #141414;
    --ink: #ececec;
    --ink-soft: #a3a3a3;
    --ink-faint: #74746f;
    --line: rgba(255, 255, 255, 0.12);
    --line-strong: rgba(255, 255, 255, 0.28);

    --accent: #7d9bff;
    --accent-ink: #14141a;
    --accent-soft: rgba(125, 155, 255, 0.15);
    --accent2: #ff9463;
    --accent2-soft: rgba(255, 148, 99, 0.15);
    --rest: #5fce8b;
    --rest-soft: rgba(95, 206, 139, 0.15);

    --card-bg: #1c1c1c;
    --card-border: 1px solid rgba(255, 255, 255, 0.1);
    --tile-bg: #1c1c1c;
    --tile-border: 1px solid rgba(255, 255, 255, 0.1);

    --topbar-bg: rgba(20, 20, 20, 0.92);

    --switch-border: 1px solid rgba(255, 255, 255, 0.14);
    --switch-active-bg: #ececec;
    --switch-active-ink: #14141a;

    --field-border: 1px solid rgba(255, 255, 255, 0.18);
    --btn-primary-bg: #ececec;
    --btn-primary-ink: #14141a;
    --btn-ghost-border: 1px solid rgba(255, 255, 255, 0.18);
    --add-border: 1px solid rgba(255, 255, 255, 0.18);
  }
  :root[data-theme="light"] {
    --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: var(--font-sans);
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --font-eyebrow: var(--font-num);
    --font-size: 15px;

    --maxw: 1000px;
    --gutter: 24px;
    --stack-gap: 14px;
    --topbar-pad: 22px;

    --h1-size: 34px; --h1-weight: 800; --h1-track: -0.035em; --h1-auth-size: 28px;
    --h2-size: 11.5px; --h2-weight: 700; --h2-track: 0.1em; --h2-gap: 20px;
    --eyebrow-size: 10.5px; --eyebrow-weight: 500; --eyebrow-track: 0.16em;
    --eyebrow-transform: uppercase; --eyebrow-color: var(--ink-faint);
    --num-weight: 500; --num-track: -0.01em;

    --page-base: #ffffff;
    --page-bg: #ffffff;
    --ink: #0a0a0a;
    --ink-soft: #5c5c5c;
    --ink-faint: #949494;
    --line: rgba(0, 0, 0, 0.1);
    --line-strong: #0a0a0a;

    --accent: #1c48d4;
    --accent-ink: #ffffff;
    --accent-soft: rgba(28, 72, 212, 0.07);
    --accent2: #c2410c;
    --accent2-soft: rgba(194, 65, 12, 0.08);
    --rest: #15803d;
    --rest-soft: rgba(21, 128, 61, 0.08);

    --card-bg: #ffffff;
    --card-border: 1px solid rgba(0, 0, 0, 0.13);
    --card-radius: 3px;
    --card-shadow: none;
    --card-pad: 24px 26px 26px;

    --tile-bg: #ffffff;
    --tile-border: 1px solid rgba(0, 0, 0, 0.13);
    --tile-radius: 3px;
    --tile-shadow: none;
    --tile-pad: 16px 18px 18px;
    --tile-gap: 0px;
    --tile-label-size: 10px; --tile-label-weight: 500; --tile-label-track: 0.14em; --tile-label-transform: uppercase;
    --tile-value-size: 24px;

    --topbar-bg: rgba(255, 255, 255, 0.92);
    --topbar-filter: blur(10px);
    --topbar-border: 1px solid var(--line-strong);

    --switch-bg: transparent;
    --switch-border: 1px solid rgba(0, 0, 0, 0.13);
    --switch-pad: 0;
    --switch-active-bg: #0a0a0a;
    --switch-active-ink: #ffffff;
    --switch-active-shadow: none;

    --field-bg: transparent;
    --field-bg-focus: var(--accent-soft);
    --field-border: 1px solid rgba(0, 0, 0, 0.18);
    --field-radius: 2px;

    --btn-primary-bg: #0a0a0a;
    --btn-primary-ink: #ffffff;
    --btn-radius: 2px;
    --btn-shadow: none;
    --btn-ghost-bg: transparent;
    --btn-ghost-border: 1px solid rgba(0, 0, 0, 0.18);

    --add-bg: transparent;
    --add-border: 1px solid rgba(0, 0, 0, 0.18);

    --bar-h: 22px; --bar-radius: 0; --bar-border: 1px solid var(--line-strong);
    --pill: 2px;
  }

/* ===== Struktur: bei allen Varianten gleich, steuert sich ueber Tokens ===== */

  * { box-sizing: border-box; }
  .hidden { display: none !important; }

  body {
    background: var(--page-bg);
    background-attachment: fixed;
    /* Deckende Grundfarbe unter dem (ggf. viewport-fixierten) Verlauf, damit
       beim Scrollen unterhalb davon keine Blitzer entstehen. */
    background-color: var(--page-base);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: var(--font-size);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    margin: 0;
  }

  .app { max-width: var(--maxw); margin: 0 auto; padding: var(--topbar-space, 150px) var(--gutter) 72px; }

  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: calc(var(--topbar-pad) + env(safe-area-inset-top)) var(--gutter) var(--topbar-pad);
    max-width: var(--maxw);
    margin: 0 auto;
    background: var(--topbar-bg);
    -webkit-backdrop-filter: var(--topbar-filter);
    backdrop-filter: var(--topbar-filter);
    border-bottom: var(--topbar-border);
    flex-wrap: wrap;
  }

  .eyebrow {
    display: block;
    font-family: var(--font-eyebrow);
    font-size: var(--eyebrow-size);
    font-weight: var(--eyebrow-weight);
    letter-spacing: var(--eyebrow-track);
    text-transform: var(--eyebrow-transform);
    color: var(--eyebrow-color);
    margin-bottom: 5px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: var(--h1-weight);
    font-size: clamp(23px, 3.3vw, var(--h1-size));
    letter-spacing: var(--h1-track);
    line-height: 1.12;
    text-wrap: balance;
    margin: 0;
  }

  .mode-switch {
    display: inline-flex;
    background: var(--switch-bg);
    border: var(--switch-border);
    border-radius: var(--pill);
    padding: var(--switch-pad);
    gap: 2px;
  }
  .mode-switch button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 17px;
    border-radius: var(--pill);
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }
  .mode-switch button.active { background: var(--switch-active-bg); color: var(--switch-active-ink); box-shadow: var(--switch-active-shadow); }
  .mode-switch button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .view { display: none; flex-direction: column; gap: var(--stack-gap); }
  .view.active { display: flex; }

  .card {
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    padding: var(--card-pad);
    min-width: 0;
  }

  .card h2 {
    font-family: var(--font-display);
    font-size: var(--h2-size);
    font-weight: var(--h2-weight);
    letter-spacing: var(--h2-track);
    color: var(--ink);
    margin: 0 0 var(--h2-gap);
  }
  .card .subtle {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin: calc(-1 * var(--h2-gap) + 4px) 0 var(--h2-gap);
  }

  .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--tile-gap); }
  .stat {
    background: var(--tile-bg);
    border: var(--tile-border);
    border-radius: var(--tile-radius);
    box-shadow: var(--tile-shadow);
    padding: var(--tile-pad);
    min-width: 0;
  }
  .stat .label {
    font-size: var(--tile-label-size);
    color: var(--ink-soft);
    font-weight: var(--tile-label-weight);
    letter-spacing: var(--tile-label-track);
    text-transform: var(--tile-label-transform);
  }
  .stat .value {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: var(--tile-value-size);
    font-weight: var(--num-weight);
    margin-top: 5px;
    letter-spacing: var(--num-track);
    color: var(--ink);
  }
  .stat.accent .value { color: var(--accent); }

  .alloc-bar { display: flex; height: var(--bar-h); border-radius: var(--bar-radius); overflow: hidden; border: var(--bar-border); }
  .alloc-bar span { display: block; height: 100%; }
  .alloc-legend { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 16px; font-size: 12.5px; }
  .alloc-legend .item { display: flex; align-items: center; gap: 7px; color: var(--ink-soft); }
  .alloc-legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .alloc-legend b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }

  .ledger-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--tile-gap); }
  .ledger-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .ledger-row:last-of-type { border-bottom: none; }
  .ledger-row .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .ledger-total {
    display: flex; justify-content: space-between;
    margin-top: 10px; padding-top: 12px;
    border-top: 1px solid var(--line-strong);
    font-weight: 700; font-size: 14px;
  }
  .ledger-total .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  table.data-table { width: auto; min-width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.data-table th {
    text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-faint); font-weight: 600; padding: 0 0 10px; white-space: nowrap;
  }
  table.data-table th:first-child, table.data-table td:first-child { text-align: left; }
  table.data-table td {
    padding: 9px 14px 9px 0;
    border-top: 1px solid var(--line);
    text-align: right;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  table.data-table td.label { font-family: var(--font-sans); color: var(--ink-soft); }
  table.data-table tr.subtotal td { font-weight: 700; color: var(--ink); border-top: 1px solid var(--line-strong); }
  table.data-table tr.subtotal td.label { color: var(--ink); }
  table.data-table tr.grandtotal td { font-weight: 700; color: var(--ink); border-top: 2px solid var(--line-strong); padding-top: 12px; }
  table.data-table .col-mine { color: var(--accent); }
  table.data-table .col-partner { color: var(--accent2); }
  .col-pos { color: var(--accent); }
  .col-neg { color: var(--accent2); }
  table.data-table td.cell-remove { text-align: right; padding-left: 8px; width: 1%; }
  .split-hint { font-size: 11px; font-weight: 400; color: var(--ink-faint); }
  .overflow-wrap { overflow-x: auto; }

  .miles-value-input { padding: 8px 12px; }
  .miles-row-extra { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .miles-row-extra input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }
  .miles-entry-form { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 18px; }
  .miles-entry-form input[type="date"] {
    font: inherit; padding: 9px 12px; border: var(--field-border);
    border-radius: var(--field-radius); background: var(--field-bg); color: var(--ink);
  }
  .btn-save-entry {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: 13px;
    border: none; background: var(--btn-primary-bg); color: var(--btn-primary-ink);
    padding: 9px 18px; border-radius: var(--btn-radius); box-shadow: var(--btn-shadow);
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn-save-entry:hover { filter: brightness(1.07); }
  .btn-save-entry:active { transform: translateY(1px); }

  .backup-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .backup-note { margin-top: 14px; font-size: 12.5px; color: var(--ink-soft); }
  .backup-note.error { color: var(--accent2); }

  .split-bar { display: flex; height: 34px; border-radius: var(--bar-radius); overflow: hidden; margin-top: 16px; border: var(--bar-border); }
  .split-bar .seg {
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; color: #fff;
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden;
  }
  .split-bar .mine { background: var(--accent); }
  .split-bar .partner { background: var(--accent2); }
  .split-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }

  .note {
    font-size: 12.5px; color: var(--ink-faint);
    background: var(--field-bg); border: var(--field-border);
    border-radius: var(--field-radius); padding: 10px 14px; margin-top: 4px;
  }
  .note .val { font-family: var(--font-num); color: var(--ink-soft); }

  /* ---- Rechner ---- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: -4px; }
  .toolbar .hint { font-size: 12.5px; color: var(--ink-faint); }
  .btn-reset {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: 13px;
    border: var(--btn-ghost-border); background: var(--btn-ghost-bg); color: var(--ink);
    padding: 9px 16px; border-radius: var(--btn-radius);
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn-reset:hover { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .field-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .field-row:last-of-type { border-bottom: none; }
  .field-row label { font-size: 13.5px; color: var(--ink-soft); }
  .field-row .input-euro { position: relative; }
  /* --u laesst einzelne Felder die Einheit abschalten (z.B. "Laufzeit in Monaten",
     das im Markup schon --u:none mitbringt). */
  .field-row .input-euro::after {
    content: var(--u, "€"); position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: var(--ink-faint); pointer-events: none;
  }
  input[type="number"], .field-row.list-row .label-input, .freq-select, .auth-field input {
    font: inherit;
    border: var(--field-border);
    border-radius: var(--field-radius);
    background: var(--field-bg);
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="number"]:focus, .label-input:focus, .auth-field input:focus {
    background: var(--field-bg-focus);
    border-color: var(--accent);
  }
  input[type="number"] {
    width: 112px;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    text-align: right;
    padding: 8px 28px 8px 12px;
  }
  input[type="number"].netto { width: 145px; font-size: 16px; font-weight: 600; padding: 10px 32px 10px 12px; }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.35; }

  /* In den dreispaltigen Listen ist wenig Platz: Betragsfeld schmaler halten,
     damit die Bezeichnung nicht schon nach wenigen Zeichen abschneidet. */
  .field-row.list-row { gap: 8px; }
  .field-row.list-row .label-input { flex: 1; font-size: 13.5px; padding: 8px 12px; min-width: 0; }
  .field-row.list-row input[type="number"] { width: 94px; padding-right: 24px; }
  .field-row.list-row .input-euro::after { right: 9px; }

<script>
  /* Muss vor dem ersten Rendern laufen: sonst blitzt beim Öffnen kurz das
     Systemschema auf, bevor die gespeicherte Wahl greift. Bewusst kein Teil
     des Hauptskripts unten, das läuft erst nach dem Aufbau der Seite. */
  (function () {
    var stored = null;
    /* localStorage wirft im privaten Modus mancher Browser statt null zu liefern. */
    try { stored = localStorage.getItem("theme"); } catch (e) {}
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
    var dark = stored === "dark" ||
      (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
  })();
</script>

<script>

  var SUPABASE_URL = "https://fqaqdxvlzzclxzgqsdgl.supabase.co";

     frei editierbare rent-Liste um - ohne dabei bereits gespeicherte Werte zu verlieren. */
  function migrateRent(saved) {
    if (Array.isArray(saved.rent)) {
      return saved.rent
        .filter(function (it) { return it && typeof it === "object"; })
        .map(function (it) {
          return {
            label: typeof it.label === "string" ? it.label : "",
            value: num(it.value),
            split: typeof it.split === "number" ? clamp(it.split, 0, 100) : 50,
            freq: normFreq(it.freq)
          };
        });
    }
    var items = [];
    if (saved.rent && typeof saved.rent === "object") {
      var rs = saved.rentSplit && typeof saved.rentSplit === "object" ? saved.rentSplit : null;
      var legacyPct = typeof saved.splitPercent === "number" ? clamp(saved.splitPercent, 0, 100) : null;
      LEGACY_RENT_KEYS.forEach(function (k) {
        if (typeof saved.rent[k] !== "number") return;
        var split = 50;
        if (rs && typeof rs[k] === "number") split = clamp(rs[k], 0, 100);
        else if (legacyPct !== null) split = (k === "internet" || k === "gez" || k === "hausrat") ? 50 : legacyPct;
        items.push({ label: LEGACY_RENT_LABELS[k], value: saved.rent[k], split: split, freq: "monthly" });
      });
    }
    if (Array.isArray(saved.rentExtra)) {
      saved.rentExtra.forEach(function (it) {
        if (!it || typeof it !== "object") return;
        items.push({
          label: typeof it.label === "string" ? it.label : "",
          value: num(it.value),
          split: typeof it.split === "number" ? clamp(it.split, 0, 100) : 50,
          freq: normFreq(it.freq)
        });
      });
    }
    return items;
  }

  async function loadRemoteState(userId) {
    var res = await sb.from("budget_state").select("data, updated_at").eq("user_id", userId).maybeSingle();
    if (res.error) throw res.error;
    if (res.data) {
      remoteUpdatedAt = res.data.updated_at;
      return mergeState(deepClone(DEFAULTS), res.data.data);
    }
    var seed = deepClone(DEFAULTS);
    var ins = await sb.from("budget_state").insert({ id: crypto.randomUUID(), user_id: userId, data: seed }).select("updated_at").single();
    if (ins.error) throw ins.error;
    remoteUpdatedAt = ins.data.updated_at;
    return seed;
  }

  function saveState() {
    var statusEl = document.getElementById("sync-status");
    if (statusEl) statusEl.textContent = "Speichert …";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      sb.from("budget_state")
        .update({ data: state, updated_at: new Date().toISOString() })
        .eq("user_id", currentUserId)
        .select("updated_at")
        .single()
        .then(function (res) {
          if (res.error) { if (statusEl) statusEl.textContent = "Speichern fehlgeschlagen"; return; }
          remoteUpdatedAt = res.data.updated_at;
          if (statusEl) statusEl.textContent = "Gespeichert";
        });
    }, 500);
  }

  function subscribeRealtime(userId) {
    realtimeChannel = sb.channel("budget_state_" + userId)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "budget_state", filter: "user_id=eq." + userId }, function (payload) {
        var row = payload.new;
        if (!row || !row.updated_at) return;
        if (remoteUpdatedAt && new Date(row.updated_at).getTime() <= new Date(remoteUpdatedAt).getTime()) return;
        remoteUpdatedAt = row.updated_at;
        state = mergeState(deepClone(DEFAULTS), row.data);
        buildRechner(state);
        render();
        var statusEl = document.getElementById("sync-status");
        if (statusEl) statusEl.textContent = "Aktualisiert von anderem Gerät";
      })
      .subscribe();
  }

  function unsubscribeRealtime() {
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  }

  var state = deepClone(DEFAULTS);

  function getPath(obj, path) {
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) cur = cur[parts[i]];
    return cur;
  }
  function setPath(obj, path, value) {
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = value;
  }

  function computeAll(s) {
    var revolutSum = s.revolut.reduce(function (a, it) { return a + monthlyValue(it); }, 0);
    var trSum = s.traderepublic.reduce(function (a, it) { return a + monthlyValue(it); }, 0);
    var sonstigesSum = s.sonstiges.reduce(function (a, it) { return a + monthlyValue(it); }, 0);
    var partnerOn = !!(s.partner && s.partner.enabled);
    var rentCalc = s.rent.map(function (it) {
      var pct = partnerOn ? clamp(num(it.split), 0, 100) / 100 : 1;
      var val = monthlyValue(it);
      var mine = val * pct;
      return { label: it.label, value: val, mine: mine, partnerVal: val - mine, rawValue: num(it.value), freq: normFreq(it.freq) };
    });
    var mieteGesamt = rentCalc.reduce(function (a, it) { return a + it.value; }, 0);
    var meineMiete = rentCalc.reduce(function (a, it) { return a + it.mine; }, 0);
    var partnerMiete = rentCalc.reduce(function (a, it) { return a + it.partnerVal; }, 0);

    /* Der eigene Mietanteil ist eine laufende Ausgabe wie jede andere und muss
       deshalb in die Summen und in "bleibt übrig". Zählt bei zwei Personen nur
       anteilig, weil die andere Hälfte nicht vom eigenen Netto abgeht. */
    var ausgabenTotal = revolutSum + sonstigesSum + meineMiete;
    var ausgabenSparenGesamt = ausgabenTotal + trSum;
    var bleibtUebrig = num(s.netto) - ausgabenSparenGesamt;
    var sparquote = num(s.netto) ? trSum / num(s.netto) : 0;

    var v = s.vodafone;
    var vodafoneMtl = num(v.monate) ? (num(v.total) - num(v.gutschein) - num(v.cashback)) / num(v.monate) : 0;

    return {
      revolutSum: revolutSum, trSum: trSum, sonstigesSum: sonstigesSum, ausgabenTotal: ausgabenTotal,
      ausgabenSparenGesamt: ausgabenSparenGesamt, bleibtUebrig: bleibtUebrig, sparquote: sparquote,
      rentCalc: rentCalc, mieteGesamt: mieteGesamt, meineMiete: meineMiete, partnerMiete: partnerMiete,
      partnerOn: partnerOn, vodafoneMtl: vodafoneMtl
    };
  }

  function computeMiles(m) {
    var providers = m.providers;
    var entriesSorted = m.entries.slice().sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    var latest = entriesSorted.length ? entriesSorted[entriesSorted.length - 1] : null;
    var previous = entriesSorted.length > 1 ? entriesSorted[entriesSorted.length - 2] : null;

    function totalFor(entry) {
      if (!entry) return 0;
      return providers.reduce(function (sum, p) {
        return p.excludeFromTotal ? sum : sum + num(entry.values[p.id]);
      }, 0);
    }

    var latestTotal = totalFor(latest);
    var previousTotal = totalFor(previous);

    var rows = providers.map(function (p) {
      var curVal = latest && latest.values[p.id] !== undefined ? num(latest.values[p.id]) : null;
      var prevVal = previous && previous.values[p.id] !== undefined ? num(previous.values[p.id]) : null;
      var diff = curVal !== null && prevVal !== null ? curVal - prevVal : null;
      return { id: p.id, label: p.label, excludeFromTotal: p.excludeFromTotal, current: curVal, previous: prevVal, diff: diff };
    });

    return {
      providers: providers, entriesSorted: entriesSorted, latest: latest, previous: previous,
      latestTotal: latestTotal, previousTotal: previousTotal,
      totalDiff: latest && previous ? latestTotal - previousTotal : null,
      rows: rows
    };
  }

  function esc(str) {
    return String(str).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- Sicherung ---------- */

  var BACKUP_FORMAT = 1;

  function backupNote(text, isError) {
    var el = document.getElementById("backup-note");
    if (!el) return;
    el.textContent = text || "";
    el.classList.toggle("error", !!isError);
  }

  function backupFilename() {
    var d = new Date();
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    return "aufteilung-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".json";
  }

  function downloadBackup() {
    var payload = {
      app: "aufteilung",
      format: BACKUP_FORMAT,
      exportedAt: new Date().toISOString(),
      data: state
    };
    var url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = backupFilename();
    /* Safari löst den Klick nur aus, wenn der Link im Dokument hängt. */
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    /* Freigeben, sonst hält der Blob Speicher bis zum Neuladen. */
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
    backupNote("Sicherung heruntergeladen: " + a.download, false);
  }

  function readBackup(file) {
    var reader = new FileReader();
    reader.onerror = function () { backupNote("Die Datei konnte nicht gelesen werden.", true); };
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (e) {
        backupNote("Das ist keine gültige Sicherung – die Datei enthält kein lesbares JSON.", true);
        return;
      }
      /* Sowohl das Exportformat mit Hülle als auch ein blanker Datenstand. */
      var incoming = parsed && typeof parsed === "object" && parsed.data && typeof parsed.data === "object"
        ? parsed.data
        : parsed;
      if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) {
        backupNote("Die Datei enthält keinen Datenstand, den ich lesen kann.", true);
        return;
      }
      if (!window.confirm("Die Sicherung ersetzt alle aktuellen Daten dieses Kontos. Fortfahren?")) {
        backupNote("Abgebrochen – es wurde nichts verändert.", false);
        return;
      }
      /* Bewusst durch mergeState statt direkt übernehmen: das prüft jeden Wert
         auf seinen Typ und ergänzt fehlende Felder aus den Standardwerten. Eine
         alte oder beschädigte Datei kann den Stand so nicht zerlegen. */
      state = mergeState(deepClone(DEFAULTS), incoming);
      buildRechner(state);
      buildMeilen(state);
      render();
      saveState();
      backupNote("Sicherung eingelesen und gespeichert.", false);
    };
    reader.readAsText(file);
  }

        saveState();

  function updateRechnerComputed(c) {
    var set = function (id, text) { var e = document.getElementById(id); if (e) e.textContent = text; };
    set("calc-ausgabenSparenGesamt", eur(c.ausgabenSparenGesamt));
    set("calc-bleibtUebrig", eur(c.bleibtUebrig));
    set("calc-sparquote", pct1(c.sparquote));
    set("calc-revolutSum", eur(c.revolutSum));
    set("calc-trSum", eur(c.trSum));
    set("calc-sonstigesSum", eur(c.sonstigesSum));
    set("calc-mieteGesamt", eur(c.mieteGesamt));
    set("calc-vodafoneMtl", eur(c.vodafoneMtl));

    if (c.partnerOn) {
      var partnerName = (state.partner && state.partner.name) || "Partner";
      state.rent.forEach(function (it, i) {
        var pct = Math.round(clamp(num(it.split), 0, 100));
        set("split-mine-label-rent-" + i, "Meine " + pct + "%");
        set("split-partner-label-rent-" + i, partnerName + " " + (100 - pct) + "%");
      });

      var minePctLabel = c.mieteGesamt ? Math.round(c.meineMiete / c.mieteGesamt * 100) : 0;
      var partnerPctLabel = 100 - minePctLabel;
      set("split-legend-mine", "Meine Kosten (" + minePctLabel + "%)");
      set("split-legend-partner", "Kosten von " + partnerName + " (" + partnerPctLabel + "%)");

      var mineWidth = clamp(c.meineMiete / (c.mieteGesamt || 1), 0, 1) * 100;
      var mineSeg = document.getElementById("split-seg-mine");
      var partnerSeg = document.getElementById("split-seg-partner");
      if (mineSeg && partnerSeg) {
        mineSeg.style.width = mineWidth + "%";
        partnerSeg.style.width = (100 - mineWidth) + "%";
        mineSeg.textContent = eur(c.meineMiete);
        partnerSeg.textContent = eur(c.partnerMiete);
      }
    }
  }

  /* ---------- Meilen ---------- */

  function milesOverviewCard(mc) {
    if (!mc.latest) {
      return '<div class="card"><h2>Aktueller Stand</h2><p class="subtle" style="margin:0">Noch kein Stand erfasst &ndash; trag oben deinen ersten Stand ein.</p></div>';
    }
    var rows = mc.rows.map(function (r) {
      var diffHtml = "";
      if (r.diff !== null && r.diff !== 0) {
        diffHtml = ' <span class="split-hint ' + (r.diff > 0 ? "col-pos" : "col-neg") + '">(' + (r.diff > 0 ? "+" : "") + intFmt(r.diff) + ')</span>';
      }
      return '<div class="calc-line"><span>' + esc(r.label || "Ohne Namen") + (r.excludeFromTotal ? ' <span class="subtle">(nicht in Summe)</span>' : "") + '</span>' +
        '<span class="val">' + (r.current === null ? "&ndash;" : intFmt(r.current)) + diffHtml + '</span></div>';
    }).join("");
    var totalDiffHtml = "";
    if (mc.totalDiff !== null && mc.totalDiff !== 0) {
      totalDiffHtml = ' <span class="split-hint ' + (mc.totalDiff > 0 ? "col-pos" : "col-neg") + '">(' + (mc.totalDiff > 0 ? "+" : "") + intFmt(mc.totalDiff) + ')</span>';
    }
    return '<div class="card">' +
      '<h2>Aktueller Stand</h2>' +
      '<p class="subtle" style="margin:0 0 10px">Stand vom ' + formatDateDe(mc.latest.date) + (mc.previous ? " &middot; vorher " + formatDateDe(mc.previous.date) : "") + '</p>' +
      rows +
      '<div class="calc-line total"><span>Gesamt</span><span class="val">' + intFmt(mc.latestTotal) + totalDiffHtml + '</span></div>' +
    '</div>';
  }

  function milesHistoryCard(mc) {
    if (!mc.entriesSorted.length) return "";
    var providers = mc.providers;
    var theadCols = providers.map(function (p) { return '<th>' + esc(p.label || "–") + '</th>'; }).join("");
    var rowsHtml = mc.entriesSorted.slice().reverse().map(function (entry) {
      var cols = providers.map(function (p) {
        var v = entry.values[p.id];
        return '<td>' + (v === undefined ? '<span class="subtle">&ndash;</span>' : intFmt(v)) + '</td>';
      }).join("");
      var total = providers.reduce(function (sum, p) { return p.excludeFromTotal ? sum : sum + num(entry.values[p.id]); }, 0);
      return '<tr>' +
        '<td class="label">' + formatDateDe(entry.date) + '</td>' +
        cols +
        '<td>' + intFmt(total) + '</td>' +
        '<td class="cell-remove"><button type="button" class="btn-remove-row" data-remove-entry="' + esc(entry.id) + '" aria-label="Eintrag entfernen">&times;</button></td>' +
      '</tr>';
    }).join("");
    return '<div class="card">' +
      '<h2>Verlauf</h2>' +
      '<div class="overflow-wrap"><table class="data-table">' +
        '<thead><tr><th>Datum</th>' + theadCols + '<th>Gesamt</th><th></th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
      '</table></div>' +
    '</div>';
  }

  function updateMeilenSummary(s) {
    var wrap = document.getElementById("miles-summary");
    if (!wrap) return;
    var mc = computeMiles(s.miles);
    wrap.innerHTML = milesOverviewCard(mc) + milesHistoryCard(mc);
    wrap.querySelectorAll("[data-remove-entry]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-remove-entry");
        state.miles.entries = state.miles.entries.filter(function (e) { return e.id !== id; });
        saveState();
        updateMeilenSummary(state);
      });
    });
  }

  function buildMeilen(s) {
    var el = document.getElementById("view-meilen");
    var mc = computeMiles(s.miles);

    var toolbar =
      '<div class="toolbar">' +
        '<span class="hint">Meilen &amp; Punkte deiner Vielfliegerprogramme im Blick behalten.</span>' +
      '</div>';

    var providerCount = s.miles.providers.length;
    var providerRows = s.miles.providers.map(function (p, i) {
      var curVal = mc.latest && mc.latest.values[p.id] !== undefined ? mc.latest.values[p.id] : 0;
      return '<div class="list-item">' +
        '<div class="field-row list-row">' +
          '<div class="list-move">' +
            '<button type="button" data-move-list="miles.providers" data-move-index="' + i + '" data-move-dir="-1" aria-label="Nach oben verschieben"' + (i === 0 ? " disabled" : "") + '>&#9650;</button>' +
            '<button type="button" data-move-list="miles.providers" data-move-index="' + i + '" data-move-dir="1" aria-label="Nach unten verschieben"' + (i === providerCount - 1 ? " disabled" : "") + '>&#9660;</button>' +
          '</div>' +
          '<input type="text" class="label-input" data-bind-text="miles.providers.' + i + '.label" value="' + esc(p.label) + '" placeholder="Anbieter">' +
          '<input type="number" step="1" inputmode="numeric" class="miles-value-input" data-provider-id="' + esc(p.id) + '" value="' + num(curVal) + '">' +
          '<button type="button" class="btn-remove-row" data-remove-list="miles.providers" data-remove-index="' + i + '" aria-label="Anbieter entfernen">&times;</button>' +
        '</div>' +
        '<label class="miles-row-extra"><input type="checkbox" class="miles-exclude-checkbox" data-provider-index="' + i + '"' + (p.excludeFromTotal ? " checked" : "") + '> Aus Gesamtsumme ausschließen</label>' +
      '</div>';
    }).join("");

    var providerEmpty = s.miles.providers.length ? "" : '<p class="subtle" style="margin:0 0 10px">Noch keine Anbieter &ndash; füge unten deine eigenen hinzu.</p>';
    var todayIso = new Date().toISOString().slice(0, 10);

    var entryForm = s.miles.providers.length
      ? '<div class="miles-entry-form">' +
          '<label for="miles-entry-date" class="subtle">Stand vom</label>' +
          '<input type="date" id="miles-entry-date" value="' + todayIso + '">' +
          '<button type="button" class="btn-save-entry" id="btn-save-miles-entry">Stand speichern</button>' +
        '</div>'
      : "";

    var providerCard =
      '<div class="card">' +
        '<h2>Meilenstände</h2>' +
        providerEmpty + providerRows +
        '<button type="button" class="btn-add-row" data-add-list="miles.providers">+ Anbieter hinzufügen</button>' +
        entryForm +
      '</div>';

    el.innerHTML = toolbar + providerCard + '<div id="miles-summary"></div>';

    el.querySelectorAll('input[data-bind-text^="miles.providers."]').forEach(function (input) {
      input.addEventListener("input", function () {
        setPath(state, input.getAttribute("data-bind-text"), input.value);
        saveState();
        updateMeilenSummary(state);
      });
    });
    el.querySelectorAll(".miles-exclude-checkbox").forEach(function (checkbox) {
      checkbox.addEventListener("change", function () {
        var idx = parseInt(checkbox.getAttribute("data-provider-index"), 10);
        state.miles.providers[idx].excludeFromTotal = checkbox.checked;
        saveState();
        updateMeilenSummary(state);
      });
    });
    el.querySelectorAll('.btn-remove-row[data-remove-list="miles.providers"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.getAttribute("data-remove-index"), 10);
        state.miles.providers.splice(idx, 1);
        buildMeilen(state);
        saveState();
      });
    });
    /* Reihenfolge der Anbieter bestimmt auch die Spaltenfolge in "Aktueller
       Stand" und im Verlauf - hier einmal umsortiert, stimmt es überall. */
    el.querySelectorAll("[data-move-dir]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var list = getPath(state, btn.getAttribute("data-move-list"));
        var idx = parseInt(btn.getAttribute("data-move-index"), 10);
        var target = idx + parseInt(btn.getAttribute("data-move-dir"), 10);
        if (target < 0 || target >= list.length) return;
        var tmp = list[idx];
        list[idx] = list[target];
        list[target] = tmp;
        buildMeilen(state);
        saveState();
      });
    });
    el.querySelector('[data-add-list="miles.providers"]').addEventListener("click", function () {
      state.miles.providers.push({ id: uid(), label: "", excludeFromTotal: false });
      buildMeilen(state);
      saveState();
      var inputs = el.querySelectorAll('[data-bind-text^="miles.providers."]');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });

    var saveBtn = document.getElementById("btn-save-miles-entry");
    if (saveBtn) {
      saveBtn.addEventListener("click", function () {
        var dateVal = document.getElementById("miles-entry-date").value;
        if (!dateVal) return;
        var values = {};
        el.querySelectorAll(".miles-value-input").forEach(function (input) {
          values[input.getAttribute("data-provider-id")] = num(input.value);
        });
        var existing = state.miles.entries.filter(function (e) { return e.date === dateVal; })[0];
        if (existing) {
          existing.values = values;
        } else {
          state.miles.entries.push({ id: uid(), date: dateVal, values: values });
        }
        buildMeilen(state);
        saveState();
      });
    }

    updateMeilenSummary(s);
  }

  function clearAuthMessage() {
    document.getElementById("auth-message-slot").innerHTML = "";

  function showAuthMessage(text, isError) {
    var slot = document.getElementById("auth-message-slot");
    slot.innerHTML = "";
    var div = document.createElement("div");
    div.className = "auth-message" + (isError ? " error" : "");

    slot.appendChild(div);

  /* Vier Zustände teilen sich ein Formular: anmelden, registrieren, Reset-Link
     anfordern und - nach dem Klick auf den Link aus der Mail - das neue Passwort
     vergeben. Pro Zustand ist nur hinterlegt, was sichtbar ist und wie es heißt. */
  var AUTH_VIEWS = {
    signin: {
      title: "Anmelden",
      sub: "Melde dich an, um dein privates Haushaltsbuch zu öffnen.",
      submit: "Anmelden",
      fields: ["email", "password"],
      forgot: true,
      switchText: "Noch kein Konto?",
      switchBtn: "Registrieren"
    },
    signup: {
      title: "Konto erstellen",
      sub: "Registriere dich, um dein eigenes, privates Haushaltsbuch anzulegen.",
      submit: "Registrieren",
      fields: ["email", "password"],
      forgot: false,
      switchText: "Schon ein Konto?",
      switchBtn: "Anmelden"
    },
    reset: {
      title: "Passwort zurücksetzen",
      sub: "Trag deine E-Mail-Adresse ein. Wir schicken dir einen Link, mit dem du ein neues Passwort vergeben kannst.",
      submit: "Link schicken",
      fields: ["email"],
      forgot: false,
      switchText: "Doch wieder eingefallen?",
      switchBtn: "Zurück zur Anmeldung"
    },
    recovery: {
      title: "Neues Passwort",
      sub: "Vergib jetzt ein neues Passwort für dein Konto – mindestens 6 Zeichen.",
      submit: "Passwort speichern",
      fields: ["newpass"],
      forgot: false,
      switchText: "Lieber doch nicht?",
      switchBtn: "Abbrechen"
    }
  };

  var AUTH_FIELDS = {
    email: { wrap: "auth-email-field", input: "auth-email" },
    password: { wrap: "auth-password-field", input: "auth-password" },
    newpass: { wrap: "auth-newpass-field", input: "auth-newpass" }
  };

  function setAuthMode(mode) {
    authMode = AUTH_VIEWS[mode] ? mode : "signin";
    var view = AUTH_VIEWS[authMode];
    clearAuthMessage();
    document.getElementById("auth-password").value = "";
    document.getElementById("auth-newpass").value = "";

    Object.keys(AUTH_FIELDS).forEach(function (key) {
      var ref = AUTH_FIELDS[key];
      var visible = view.fields.indexOf(key) !== -1;
      document.getElementById(ref.wrap).classList.toggle("hidden", !visible);
      /* required nur an sichtbaren Feldern setzen: ein ausgeblendetes Pflichtfeld
         blockiert das Absenden, ohne dass der Browser es anspringen könnte. */
      document.getElementById(ref.input).required = visible;
    });

    document.getElementById("auth-title").textContent = view.title;
    document.getElementById("auth-sub").textContent = view.sub;
    document.getElementById("auth-submit").textContent = view.submit;
    document.getElementById("auth-switch-text").textContent = view.switchText;
    document.getElementById("auth-switch-btn").textContent = view.switchBtn;
    document.getElementById("auth-forgot-row").classList.toggle("hidden", !view.forgot);
  }

  function translateAuthError(err) {
    var msg = (err && err.message) || "";
    /* Die Link-Prüfung muss vor die E-Mail-Prüfung: "Email link is invalid or has
       expired" enthält beides und würde sonst als Tippfehler in der Adresse gedeutet. */
    if (/(link|token|otp)/i.test(msg) && /(expired|invalid)/i.test(msg)) return "Der Link ist abgelaufen oder wurde schon benutzt. Fordere bitte einen neuen an.";
    if (/auth session missing/i.test(msg)) return "Die Sitzung ist abgelaufen. Bitte fordere einen neuen Link an.";
    if (/already registered/i.test(msg)) return "Für diese E-Mail existiert bereits ein Konto. Bitte stattdessen anmelden.";
    if (/invalid login credentials/i.test(msg)) return "E-Mail oder Passwort ist falsch.";
    if (/new password should be different/i.test(msg)) return "Das neue Passwort muss sich vom bisherigen unterscheiden.";
    if (/only request this after/i.test(msg)) return "Zu viele Versuche in kurzer Zeit. Bitte warte einen Moment und probiere es dann erneut.";
    if (/password/i.test(msg) && /(6|least)/i.test(msg)) return "Das Passwort muss mindestens 6 Zeichen lang sein.";
    if (/email/i.test(msg) && /invalid/i.test(msg)) return "Bitte eine gültige E-Mail-Adresse angeben.";
    return msg || "Etwas ist schiefgelaufen. Bitte erneut versuchen.";
  }

  document.getElementById("auth-switch-btn").addEventListener("click", function () {
    /* Im Recovery-Modus hängt eine gültige Sitzung aus dem Mail-Link am Client.
       Abmelden verwirft sie, der SIGNED_OUT-Handler bringt uns zurück zum Login. */
    if (authMode === "recovery") { sb.auth.signOut(); return; }
    setAuthMode(authMode === "signin" ? "signup" : "signin");
  });

  document.getElementById("auth-forgot-btn").addEventListener("click", function () {
    setAuthMode("reset");
  });

  document.getElementById("auth-form").addEventListener("submit", function (e) {
    e.preventDefault();
    clearAuthMessage();
    var email = document.getElementById("auth-email").value.trim();
    var password = document.getElementById("auth-password").value;
    var newPassword = document.getElementById("auth-newpass").value;
    var submitBtn = document.getElementById("auth-submit");
    /* Modus festhalten: setAuthMode() im Erfolgsfall verändert ihn sonst mitten
       in der Auswertung. */
    var mode = authMode;
    submitBtn.disabled = true;

    var request;
    if (mode === "signup") request = sb.auth.signUp({ email: email, password: password });
    else if (mode === "reset") request = sb.auth.resetPasswordForEmail(email, { redirectTo: appUrl() });
    else if (mode === "recovery") request = sb.auth.updateUser({ password: newPassword });
    else request = sb.auth.signInWithPassword({ email: email, password: password });

    request.then(function (res) {
      if (res.error) { showAuthMessage(translateAuthError(res.error), true); return; }

      if (mode === "signup" && !res.data.session) {
        setAuthMode("signin");
        showAuthMessage("Fast geschafft: Wir haben dir eine Bestätigungs-E-Mail geschickt. Bitte bestätige deine Adresse und melde dich danach an.", false);
      } else if (mode === "reset") {
        setAuthMode("signin");
        /* Bewusst ohne Aussage darüber, ob es das Konto gibt - sonst ließen sich
           über das Formular fremde Adressen durchprobieren. */
        showAuthMessage("Falls es zu " + email + " ein Konto gibt, ist der Link jetzt unterwegs. Schau zur Sicherheit auch im Spam-Ordner nach.", false);
      } else if (mode === "recovery") {
        recoveryActive = false;
        var user = res.data && res.data.user;
        if (user) {
          lastHandledUserId = user.id;
          loadUserData(user);
        } else {
          setAuthMode("signin");
          showAuthMessage("Passwort geändert. Bitte melde dich mit dem neuen Passwort an.", false);
        }
      }
      /* Bei erfolgreichem Login/Registrierung mit sofortiger Session übernimmt
         onAuthStateChange unten das Laden der Daten und Umschalten der Ansicht. */
    }).finally(function () {
      submitBtn.disabled = false;
    });
  });

  document.getElementById("btn-logout").addEventListener("click", function () {
    sb.auth.signOut();
  });

  async function loadUserData(user) {
    showScreen("loading");
    document.getElementById("loading-text").textContent = "Daten werden geladen …";
    try {
      state = await loadRemoteState(user.id);
    } catch (e) {
      document.getElementById("loading-text").textContent = "Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.";
      var existingRetry = document.getElementById("loading-retry");
      if (!existingRetry) {
        var retry = document.createElement("button");
        retry.type = "button";
        retry.id = "loading-retry";
        retry.className = "btn-reset";
        retry.textContent = "Erneut versuchen";
        retry.addEventListener("click", function () { window.location.reload(); });
        document.getElementById("loading-screen").appendChild(retry);
      }
      return;
    }
    currentUserId = user.id;
    document.getElementById("account-email").textContent = user.email || "";
    buildRechner(state);
    buildMeilen(state);
    render();
    subscribeRealtime(user.id);
    showScreen("app");
  }

  var lastHandledUserId = null;

  sb.auth.onAuthStateChange(function (event, session) {
    /* Ein Reset-Link meldet die Person technisch bereits an. Ohne diese Weiche
       liefe sie direkt in die App, ohne je ein neues Passwort gesetzt zu haben. */
    if (recoveryActive && event !== "SIGNED_OUT") {
      if (session && session.user) {
        lastHandledUserId = null;
        setAuthMode("recovery");
        showScreen("auth");
      }
      return;
    }

    if (session && session.user) {
      if (lastHandledUserId === session.user.id) return;
      lastHandledUserId = session.user.id;
      loadUserData(session.user);
    } else {
      recoveryActive = false;
      lastHandledUserId = null;
      unsubscribeRealtime();
      currentUserId = null;
      state = deepClone(DEFAULTS);
      document.getElementById("auth-email").value = "";
      setAuthMode("signin");
      /* Abgelaufener oder schon benutzter Link: Supabase hängt den Grund an die
         URL, ohne dass je eine Session entsteht. */
      if (urlAuthError) {
        showAuthMessage(translateAuthError({ message: urlAuthError }), true);
        urlAuthError = null;
      }
      showScreen("auth");
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js");
    });
  }
})();
</script>
