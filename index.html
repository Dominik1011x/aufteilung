<style>
  :root {
    --paper: #f5f3ee;
    --paper-raised: #ffffff;
    --ink: #1c211f;
    --ink-soft: #57645f;
    --ink-faint: #8a948f;
    --line: rgba(28, 33, 31, 0.13);
    --line-strong: rgba(28, 33, 31, 0.22);
    --accent: #2f6f62;
    --accent-ink: #ffffff;
    --accent-soft: #e3efec;
    --accent2: #8a4a6a;
    --accent2-soft: #f4e8ee;
    --rest: #c7a955;
    --rest-soft: #f6efdd;
    --shadow: 0 1px 2px rgba(28, 33, 31, 0.05), 0 8px 24px -16px rgba(28, 33, 31, 0.25);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12181a;
      --paper-raised: #1a2325;
      --ink: #edf2f0;
      --ink-soft: #a3b3ad;
      --ink-faint: #6e7d78;
      --line: rgba(237, 242, 240, 0.11);
      --line-strong: rgba(237, 242, 240, 0.2);
      --accent: #6fbfa8;
      --accent-ink: #0c1614;
      --accent-soft: rgba(111, 191, 168, 0.14);
      --accent2: #dd9cc0;
      --accent2-soft: rgba(221, 156, 192, 0.14);
      --rest: #e0c479;
      --rest-soft: rgba(224, 196, 121, 0.14);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -16px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #12181a;
    --paper-raised: #1a2325;
    --ink: #edf2f0;
    --ink-soft: #a3b3ad;
    --ink-faint: #6e7d78;
    --line: rgba(237, 242, 240, 0.11);
    --line-strong: rgba(237, 242, 240, 0.2);
    --accent: #6fbfa8;
    --accent-ink: #0c1614;
    --accent-soft: rgba(111, 191, 168, 0.14);
    --accent2: #dd9cc0;
    --accent2-soft: rgba(221, 156, 192, 0.14);
    --rest: #e0c479;
    --rest-soft: rgba(224, 196, 121, 0.14);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -16px rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    --paper: #f5f3ee;
    --paper-raised: #ffffff;
    --ink: #1c211f;
    --ink-soft: #57645f;
    --ink-faint: #8a948f;
    --line: rgba(28, 33, 31, 0.13);
    --line-strong: rgba(28, 33, 31, 0.22);
    --accent: #2f6f62;
    --accent-ink: #ffffff;
    --accent-soft: #e3efec;
    --accent2: #8a4a6a;
    --accent2-soft: #f4e8ee;
    --rest: #c7a955;
    --rest-soft: #f6efdd;
    --shadow: 0 1px 2px rgba(28, 33, 31, 0.05), 0 8px 24px -16px rgba(28, 33, 31, 0.25);
  }

  * { box-sizing: border-box; }
  .hidden { display: none !important; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .app { max-width: 980px; margin: 0 auto; padding: 0 20px 64px; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: calc(22px + env(safe-area-inset-top)) 0 18px;
    background: var(--paper);
    flex-wrap: wrap;
  }

  .eyebrow {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(24px, 3.4vw, 32px);
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0;
  }

  .mode-switch {
    display: inline-flex;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    box-shadow: var(--shadow);
  }
  .mode-switch button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mode-switch button.active { background: var(--accent); color: var(--accent-ink); }
  .mode-switch button:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .view { display: none; flex-direction: column; gap: 20px; }
  .view.active { display: flex; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    min-width: 0;
  }

  .card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 14px;
  }
  .card .subtle {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin: -10px 0 14px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .stat {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    min-width: 0;
  }
  .stat .label { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; letter-spacing: 0.02em; }
  .stat .value {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 600;
    margin-top: 4px;
    letter-spacing: -0.01em;
  }
  .stat.accent .value { color: var(--accent); }

  .alloc-bar {
    display: flex;
    height: 30px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .alloc-bar span { display: block; height: 100%; }
  .alloc-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    margin-top: 14px;
    font-size: 12.5px;
  }
  .alloc-legend .item { display: flex; align-items: center; gap: 7px; color: var(--ink-soft); }
  .alloc-legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .alloc-legend b {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .ledger-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .ledger-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .ledger-row:last-of-type { border-bottom: none; }
  .ledger-row .val {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .ledger-total {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line-strong);
    font-weight: 700;
    font-size: 14px;
  }
  .ledger-total .val {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  table.rent-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.rent-table th {
    text-align: right;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    font-weight: 600;
    padding: 0 0 8px;
  }
  table.rent-table th:first-child, table.rent-table td:first-child { text-align: left; }
  table.rent-table td {
    padding: 7px 0;
    border-top: 1px solid var(--line);
    text-align: right;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  table.rent-table td.label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink-soft);
  }
  table.rent-table tr.subtotal td { font-weight: 700; color: var(--ink); border-top: 1px solid var(--line-strong); }
  table.rent-table tr.subtotal td.label { color: var(--ink); }
  table.rent-table tr.grandtotal td { font-weight: 700; color: var(--ink); border-top: 2px solid var(--line-strong); padding-top: 10px; }
  table.rent-table .col-mine { color: var(--accent); }
  table.rent-table .col-partner { color: var(--accent2); }
  .split-hint { font-size: 11px; font-weight: 400; color: var(--ink-faint); }
  .overflow-wrap { overflow-x: auto; }

  .split-bar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin-top: 16px; border: 1px solid var(--line); }
  .split-bar .seg {
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; color: var(--accent-ink);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden;
  }
  .split-bar .mine { background: var(--accent); }
  .split-bar .partner { background: var(--accent2); }
  .split-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }

  .note {
    font-size: 12.5px;
    color: var(--ink-faint);
    background: var(--paper);
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 4px;
  }
  .note .val { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--ink-soft); }

  /* Rechner (editable) view */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: -4px; }
  .toolbar .hint { font-size: 12.5px; color: var(--ink-faint); }
  .btn-reset {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: 13px;
    border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink);
    padding: 8px 14px; border-radius: 8px;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  .field-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .field-row:last-of-type { border-bottom: none; }
  .field-row label { font-size: 13.5px; color: var(--ink-soft); }
  .field-row .input-euro { position: relative; }
  .field-row .input-euro::after {
    content: "€"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: var(--ink-faint); pointer-events: none;
  }
  input[type="number"] {
    width: 110px;
    font: inherit;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    text-align: right;
    padding: 6px 26px 6px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink);
  }
  input[type="number"].netto { width: 140px; font-size: 16px; padding: 8px 30px 8px 10px; }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }

  .field-row.list-row .label-input {
    flex: 1; font: inherit; font-size: 13.5px; padding: 6px 10px; min-width: 0;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink);
  }
  .freq-select {
    flex: none; font: inherit; font-size: 11.5px; padding: 6px 4px;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink-soft); width: 62px;
  }
  .btn-remove-row {
    appearance: none; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; font-size: 15px; line-height: 1;
    border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-faint);
  }
  .btn-remove-row:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-add-row {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: 12.5px;
    width: 100%; margin-top: 8px; padding: 7px 12px; border-radius: 7px;
    border: 1px dashed var(--line-strong); background: none; color: var(--accent);
  }
  .btn-add-row:hover { border-color: var(--accent); background: var(--accent-soft); }

  .partner-row { display: flex; align-items: center; gap: 10px; margin: -4px 0 18px; flex-wrap: wrap; }
  .partner-row .partner-row-label { font-size: 12.5px; color: var(--ink-faint); flex: none; }
  .partner-row .partner-name-input { flex: 1; min-width: 120px; max-width: 220px; }

  .list-item, .rent-item { margin-bottom: 12px; }
  .list-item:last-of-type, .rent-item:last-of-type { margin-bottom: 0; }
  .rent-item .split-item-head { margin-top: 6px; }
  .rent-item input[type="range"] { width: 100%; accent-color: var(--accent); }
  .freq-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .split-item-head {
    display: flex; align-items: baseline; justify-content: flex-end;
    font-size: 12.5px; margin-bottom: 6px;
  }
  .pct-readout {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px; font-weight: 700;
  }
  .pct-readout .mine { color: var(--accent); }
  .pct-readout .partner { color: var(--accent2); }

  .calc-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; }
  .calc-line .val {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .calc-line.total { border-top: 1px solid var(--line-strong); margin-top: 4px; padding-top: 8px; font-weight: 700; }

  footer.savebar {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    font-size: 12px; color: var(--ink-faint); margin-top: 22px;
  }
  footer.savebar .dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .loading-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--paper); color: var(--ink-soft); font-size: 14px; text-align: center; padding: 24px;
  }
  .loading-screen.hidden { display: none; }
  .loading-spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid var(--line-strong); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .loading-spinner { animation: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-screen .btn-reset { margin-top: 4px; }

  .auth-screen {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); padding: 24px;
  }
  .auth-screen.hidden { display: none; }
  .auth-card {
    width: 100%; max-width: 360px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 26px;
  }
  .auth-card .eyebrow { display: block; margin-bottom: 4px; }
  .auth-card h1 {
    font-family: Georgia, "Times New Roman", serif; font-size: 22px; margin: 0 0 4px;
  }
  .auth-card .auth-sub { font-size: 13px; color: var(--ink-faint); margin: 0 0 20px; }
  .auth-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .auth-field label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .auth-field input {
    font: inherit; font-size: 14.5px; padding: 9px 11px;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink); width: 100%;
  }
  .auth-submit {
    width: 100%; appearance: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px;
    border: none; background: var(--accent); color: var(--accent-ink);
    padding: 10px 14px; border-radius: 8px; margin-top: 4px;
  }
  .auth-submit:disabled { opacity: 0.6; cursor: default; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--ink-faint); margin-top: 16px; }
  .auth-switch button {
    appearance: none; border: none; background: none; cursor: pointer;
    font: inherit; font-weight: 700; color: var(--accent); padding: 0;
  }
  .auth-message {
    font-size: 13px; border-radius: 7px; padding: 9px 11px; margin-bottom: 14px;
    background: var(--rest-soft); color: var(--ink);
  }
  .auth-message.error { background: var(--accent2-soft); color: var(--accent2); }

  .account-chip { display: flex; align-items: center; gap: 10px; }
  .account-chip .account-email { font-size: 12.5px; color: var(--ink-faint); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-logout {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: 12.5px;
    border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-soft);
    padding: 6px 12px; border-radius: 999px;
  }
  .btn-logout:hover { border-color: var(--accent2); color: var(--accent2); }

  @media (max-width: 720px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .ledger-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .mode-switch button, .btn-reset, .alloc-bar span, .split-bar .seg { transition: all 0.18s ease; }
  }
</style>

<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner" aria-hidden="true"></div>
  <div id="loading-text">Sitzung wird geprüft …</div>
</div>

<div class="auth-screen hidden" id="auth-screen">
  <div class="auth-card">
    <span class="eyebrow">Haushaltsbuch</span>
    <h1 id="auth-title">Anmelden</h1>
    <p class="auth-sub" id="auth-sub">Melde dich an, um dein privates Haushaltsbuch zu öffnen.</p>
    <div id="auth-message-slot"></div>
    <form id="auth-form">
      <div class="auth-field">
        <label for="auth-email">E-Mail</label>
        <input type="email" id="auth-email" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="auth-password">Passwort</label>
        <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="auth-submit">Anmelden</button>
    </form>
    <div class="auth-switch">
      <span id="auth-switch-text">Noch kein Konto?</span>
      <button type="button" id="auth-switch-btn">Registrieren</button>
    </div>
  </div>
</div>

<div class="app hidden" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Haushaltsbuch</span>
      <h1>Gehalt &amp; Mietaufteilung</h1>
    </div>
    <nav class="mode-switch" role="tablist" aria-label="Ansicht wählen">
      <button type="button" data-mode="dashboard" class="active" role="tab" aria-selected="true">Übersicht</button>
      <button type="button" data-mode="rechner" role="tab" aria-selected="false">Rechner</button>
    </nav>
    <div class="account-chip">
      <span class="account-email" id="account-email"></span>
      <button type="button" class="btn-logout" id="btn-logout">Abmelden</button>
    </div>
  </header>

  <main>
    <section id="view-dashboard" class="view active" aria-label="Übersicht"></section>
    <section id="view-rechner" class="view" aria-label="Rechner"></section>
  </main>

  <footer class="savebar"><span class="dot-live" aria-hidden="true"></span> <span id="sync-status">Verbunden</span> &ndash; Änderungen werden geräteübergreifend synchronisiert.</footer>
</div>

  function mergeState(base, saved) {
    if (saved && typeof saved === "object") {
      if (typeof saved.netto === "number") base.netto = saved.netto;
      ["revolut", "traderepublic", "sonstiges"].forEach(function (key) {
        if (Array.isArray(saved[key])) {

            .map(function (item) { return { label: typeof item.label === "string" ? item.label : "", value: num(item.value), freq: normFreq(item.freq) }; });
        }
      });
      if (saved.rent !== undefined || saved.rentExtra !== undefined) {
        base.rent = migrateRent(saved);
      }

        base.partner.enabled = !!saved.partner.enabled;

      } else if (typeof saved.splitPercent === "number") {

        base.partner.enabled = true;

  /* Wandelt jede bisherige Datenform (feste rent-Objekte + rentSplit/rentExtra
     aus früheren Versionen, oder das ganz alte splitPercent) in die aktuelle,
     frei editierbare rent-Liste um - ohne dabei bereits gespeicherte Werte zu verlieren. */
  function migrateRent(saved) {
    if (Array.isArray(saved.rent)) {
      return saved.rent
        .filter(function (it) { return it && typeof it === "object"; })
        .map(function (it) {
          return {
            label: typeof it.label === "string" ? it.label : "",
            value: num(it.value),
            split: typeof it.split === "number" ? clamp(it.split, 0, 100) : 50,
            freq: normFreq(it.freq)
          };
        });
    }
    var items = [];
    if (saved.rent && typeof saved.rent === "object") {
      var rs = saved.rentSplit && typeof saved.rentSplit === "object" ? saved.rentSplit : null;
      var legacyPct = typeof saved.splitPercent === "number" ? clamp(saved.splitPercent, 0, 100) : null;
      LEGACY_RENT_KEYS.forEach(function (k) {
        if (typeof saved.rent[k] !== "number") return;
        var split = 50;
        if (rs && typeof rs[k] === "number") split = clamp(rs[k], 0, 100);
        else if (legacyPct !== null) split = (k === "internet" || k === "gez" || k === "hausrat") ? 50 : legacyPct;
        items.push({ label: LEGACY_RENT_LABELS[k], value: saved.rent[k], split: split, freq: "monthly" });
      });
    }
    if (Array.isArray(saved.rentExtra)) {
      saved.rentExtra.forEach(function (it) {
        if (!it || typeof it !== "object") return;
        items.push({
          label: typeof it.label === "string" ? it.label : "",
          value: num(it.value),
          split: typeof it.split === "number" ? clamp(it.split, 0, 100) : 50,
          freq: normFreq(it.freq)
        });
      });
    }
    return items;
  }

  async function loadRemoteState(userId) {
    var res = await sb.from("budget_state").select("data, updated_at").eq("user_id", userId).maybeSingle();
    if (res.error) throw res.error;
    if (res.data) {
      remoteUpdatedAt = res.data.updated_at;
      return mergeState(deepClone(DEFAULTS), res.data.data);
    }
    var seed = deepClone(DEFAULTS);
    var ins = await sb.from("budget_state").insert({ id: crypto.randomUUID(), user_id: userId, data: seed }).select("updated_at").single();
    if (ins.error) throw ins.error;
    remoteUpdatedAt = ins.data.updated_at;
    return seed;
  }

    if (statusEl) statusEl.textContent = "Speichert …";
    clearTimeout(saveTimer);

        .update({ data: state, updated_at: new Date().toISOString() })
        .eq("user_id", currentUserId)
        .select("updated_at")
        .single()
        .then(function (res) {
          if (res.error) { if (statusEl) statusEl.textContent = "Speichern fehlgeschlagen"; return; }
          remoteUpdatedAt = res.data.updated_at;

        });
    }, 500);
  }

        var row = payload.new;
        if (!row || !row.updated_at) return;
        if (remoteUpdatedAt && new Date(row.updated_at).getTime() <= new Date(remoteUpdatedAt).getTime()) return;
        remoteUpdatedAt = row.updated_at;
        state = mergeState(deepClone(DEFAULTS), row.data);
        buildRechner(state);
        render();
        var statusEl = document.getElementById("sync-status");
        if (statusEl) statusEl.textContent = "Aktualisiert von anderem Gerät";

  function setPath(obj, path, value) {
    var parts = path.split(".");

    for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = value;
  }

  function computeAll(s) {
    var revolutSum = s.revolut.reduce(function (a, it) { return a + monthlyValue(it); }, 0);
    var trSum = s.traderepublic.reduce(function (a, it) { return a + monthlyValue(it); }, 0);
    var sonstigesSum = s.sonstiges.reduce(function (a, it) { return a + monthlyValue(it); }, 0);
    var ausgabenSparenGesamt = revolutSum + sonstigesSum + trSum;
    var bleibtUebrig = num(s.netto) - ausgabenSparenGesamt;
    var sparquote = num(s.netto) ? trSum / num(s.netto) : 0;

    var partnerOn = !!(s.partner && s.partner.enabled);
    var rentCalc = s.rent.map(function (it) {
      var pct = partnerOn ? clamp(num(it.split), 0, 100) / 100 : 1;
      var val = monthlyValue(it);
      var mine = val * pct;
      return { label: it.label, value: val, mine: mine, partnerVal: val - mine, rawValue: num(it.value), freq: normFreq(it.freq) };
    });
    var mieteGesamt = rentCalc.reduce(function (a, it) { return a + it.value; }, 0);
    var meineMiete = rentCalc.reduce(function (a, it) { return a + it.mine; }, 0);
    var partnerMiete = rentCalc.reduce(function (a, it) { return a + it.partnerVal; }, 0);

    var v = s.vodafone;
    var vodafoneMtl = num(v.monate) ? (num(v.total) - num(v.gutschein) - num(v.cashback)) / num(v.monate) : 0;

    return {
      revolutSum: revolutSum, trSum: trSum, sonstigesSum: sonstigesSum,
      ausgabenSparenGesamt: ausgabenSparenGesamt, bleibtUebrig: bleibtUebrig, sparquote: sparquote,
      rentCalc: rentCalc, mieteGesamt: mieteGesamt, meineMiete: meineMiete, partnerMiete: partnerMiete,
      partnerOn: partnerOn, vodafoneMtl: vodafoneMtl
    };
  }

  function esc(str) {
    return String(str).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];

  }

      ? '<div class="split-bar" id="split-bar-live">' +
          '<div class="seg mine" id="split-seg-mine"></div>' +
          '<div class="seg partner" id="split-seg-partner"></div>' +
        '</div>' +
        '<div class="split-legend"><span id="split-legend-mine"></span><span id="split-legend-partner"></span></div>'
      : "";

    var rentCard =
      '<div class="card">' +
        '<h2>Zusammensetzung Miete</h2>' +
        partnerRow +
        rentEmpty + rentRows +
        '<button type="button" class="btn-add-row" data-add-list="rent">+ Position hinzufügen</button>' +
        '<div class="calc-line total"><span>Gesamt Miete</span><span class="val" id="calc-mieteGesamt"></span></div>' +
        splitBarHtml +
      '</div>';

    var vodafoneCard =
      '<div class="card">' +
        '<h2>Vodafone-Vertrag</h2>' +
        '<div class="field-row"><label>Vertragskosten gesamt</label><div class="input-euro">' + inputField("vodafone.total", s.vodafone.total) + '</div></div>' +
        '<div class="field-row"><label>BestChoice Gutschein</label><div class="input-euro">' + inputField("vodafone.gutschein", s.vodafone.gutschein) + '</div></div>' +
        '<div class="field-row"><label>Cashback nach 6 Monaten</label><div class="input-euro">' + inputField("vodafone.cashback", s.vodafone.cashback) + '</div></div>' +
        '<div class="field-row"><label>Laufzeit (Monate)</label><div class="input-euro" style="--u:none"><input type="number" step="1" class="" data-bind="vodafone.monate" value="' + num(s.vodafone.monate) + '"></div></div>' +
        '<div class="calc-line total"><span>Ø Kosten pro Monat</span><span class="val" id="calc-vodafoneMtl"></span></div>' +
      '</div>';

    el.innerHTML = toolbar + salaryCard + ledgerGrid + rentCard + vodafoneCard;

    el.querySelectorAll("input[data-bind]").forEach(function (input) {
      input.addEventListener("input", function () {
        setPath(state, input.getAttribute("data-bind"), num(input.value));
        render();
        saveState();
      });
    });
    el.querySelectorAll("input[data-bind-text]").forEach(function (input) {
      input.addEventListener("input", function () {
        setPath(state, input.getAttribute("data-bind-text"), input.value);
        render();
        saveState();
      });
    });
    el.querySelectorAll("[data-bind-select]").forEach(function (select) {
      select.addEventListener("change", function () {
        setPath(state, select.getAttribute("data-bind-select"), select.value);
        render();
        saveState();
      });
    });
    el.querySelectorAll(".btn-remove-row").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var list = btn.getAttribute("data-remove-list");
        var idx = parseInt(btn.getAttribute("data-remove-index"), 10);
        getPath(state, list).splice(idx, 1);
        buildRechner(state);
        render();
        saveState();
      });
    });
    el.querySelectorAll(".btn-add-row").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var list = btn.getAttribute("data-add-list");
        var item = { label: "", value: 0, freq: "monthly" };
        if (list === "rent") item.split = 50;
        getPath(state, list).push(item);
        buildRechner(state);
        render();
        saveState();
        var inputs = el.querySelectorAll('[data-bind-text^="' + list + '."]');
        if (inputs.length) inputs[inputs.length - 1].focus();
      });
    });
    if (partnerOn) {
      document.getElementById("btn-remove-partner").addEventListener("click", function () {
        state.partner.enabled = false;
        buildRechner(state);
        render();
        saveState();
      });
      document.getElementById("partner-name-input").addEventListener("input", function (e) {
        state.partner.name = e.target.value;
        render();
        saveState();
      });
      el.querySelectorAll(".rent-item-split-range").forEach(function (input) {
        input.addEventListener("input", function (e) {
          var idx = parseInt(e.target.getAttribute("data-rent-index"), 10);
          state.rent[idx].split = num(e.target.value);
          render();
          saveState();
        });
      });
    } else {
      document.getElementById("btn-add-partner").addEventListener("click", function () {
        state.partner.enabled = true;
        buildRechner(state);
        render();
        saveState();
      });
    }
    document.getElementById("btn-reset").addEventListener("click", function () {
      state = deepClone(DEFAULTS);
      buildRechner(state);
      render();
      saveState();
    });
  }

  function updateRechnerComputed(c) {
    var set = function (id, text) { var e = document.getElementById(id); if (e) e.textContent = text; };
    set("calc-ausgabenSparenGesamt", eur(c.ausgabenSparenGesamt));
    set("calc-bleibtUebrig", eur(c.bleibtUebrig));
    set("calc-sparquote", pct1(c.sparquote));
    set("calc-revolutSum", eur(c.revolutSum));
    set("calc-trSum", eur(c.trSum));
    set("calc-sonstigesSum", eur(c.sonstigesSum));
    set("calc-mieteGesamt", eur(c.mieteGesamt));
    set("calc-vodafoneMtl", eur(c.vodafoneMtl));

    if (c.partnerOn) {
      var partnerName = (state.partner && state.partner.name) || "Partner";
      state.rent.forEach(function (it, i) {
        var pct = Math.round(clamp(num(it.split), 0, 100));
        set("split-mine-label-rent-" + i, "Meine " + pct + "%");
        set("split-partner-label-rent-" + i, partnerName + " " + (100 - pct) + "%");
      });

      var minePctLabel = c.mieteGesamt ? Math.round(c.meineMiete / c.mieteGesamt * 100) : 0;
      var partnerPctLabel = 100 - minePctLabel;
      set("split-legend-mine", "Meine Kosten (" + minePctLabel + "%)");
      set("split-legend-partner", "Kosten von " + partnerName + " (" + partnerPctLabel + "%)");

      var mineWidth = clamp(c.meineMiete / (c.mieteGesamt || 1), 0, 1) * 100;
      var mineSeg = document.getElementById("split-seg-mine");
      var partnerSeg = document.getElementById("split-seg-partner");
      if (mineSeg && partnerSeg) {
        mineSeg.style.width = mineWidth + "%";
        partnerSeg.style.width = (100 - mineWidth) + "%";
        mineSeg.textContent = eur(c.meineMiete);
        partnerSeg.textContent = eur(c.partnerMiete);
      }
    }
  }

  function render() {
    var c = computeAll(state);
    renderDashboard(state, c);
    updateRechnerComputed(c);
  }

  /* ---------- Mode switching ---------- */

  document.querySelectorAll(".mode-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".mode-switch button").forEach(function (b) {
        b.classList.remove("active");
        b.setAttribute("aria-selected", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      var mode = btn.getAttribute("data-mode");
      document.getElementById("view-dashboard").classList.toggle("active", mode === "dashboard");
      document.getElementById("view-rechner").classList.toggle("active", mode === "rechner");
    });
  });

  /* ---------- Auth ---------- */

  var authMode = "signin";

  function showScreen(name) {
    document.getElementById("loading-screen").classList.toggle("hidden", name !== "loading");
    document.getElementById("auth-screen").classList.toggle("hidden", name !== "auth");
    document.getElementById("app").classList.toggle("hidden", name !== "app");
  }

  function clearAuthMessage() {
    document.getElementById("auth-message-slot").innerHTML = "";
  }

  function showAuthMessage(text, isError) {
    var slot = document.getElementById("auth-message-slot");
    slot.innerHTML = "";
    var div = document.createElement("div");
    div.className = "auth-message" + (isError ? " error" : "");
    div.textContent = text;
    slot.appendChild(div);
  }

  function setAuthMode(mode) {
    authMode = mode;
    clearAuthMessage();
    document.getElementById("auth-password").value = "";
    if (mode === "signup") {
      document.getElementById("auth-title").textContent = "Konto erstellen";
      document.getElementById("auth-sub").textContent = "Registriere dich, um dein eigenes, privates Haushaltsbuch anzulegen.";
      document.getElementById("auth-submit").textContent = "Registrieren";
      document.getElementById("auth-switch-text").textContent = "Schon ein Konto?";
      document.getElementById("auth-switch-btn").textContent = "Anmelden";
    } else {
      document.getElementById("auth-title").textContent = "Anmelden";
      document.getElementById("auth-sub").textContent = "Melde dich an, um dein privates Haushaltsbuch zu öffnen.";
      document.getElementById("auth-submit").textContent = "Anmelden";
      document.getElementById("auth-switch-text").textContent = "Noch kein Konto?";
      document.getElementById("auth-switch-btn").textContent = "Registrieren";
    }
  }

  function translateAuthError(err) {
    var msg = (err && err.message) || "";
    if (/already registered/i.test(msg)) return "Für diese E-Mail existiert bereits ein Konto. Bitte stattdessen anmelden.";
    if (/invalid login credentials/i.test(msg)) return "E-Mail oder Passwort ist falsch.";
    if (/password/i.test(msg) && /(6|least)/i.test(msg)) return "Das Passwort muss mindestens 6 Zeichen lang sein.";
    if (/email/i.test(msg) && /invalid/i.test(msg)) return "Bitte eine gültige E-Mail-Adresse angeben.";
    return msg || "Etwas ist schiefgelaufen. Bitte erneut versuchen.";
  }

  document.getElementById("auth-switch-btn").addEventListener("click", function () {
    setAuthMode(authMode === "signin" ? "signup" : "signin");
  });

  document.getElementById("auth-form").addEventListener("submit", function (e) {
    e.preventDefault();
    clearAuthMessage();
    var email = document.getElementById("auth-email").value.trim();
    var password = document.getElementById("auth-password").value;
    var submitBtn = document.getElementById("auth-submit");
    submitBtn.disabled = true;

    var request = authMode === "signup"
      ? sb.auth.signUp({ email: email, password: password })
      : sb.auth.signInWithPassword({ email: email, password: password });

    request.then(function (res) {
      if (res.error) { showAuthMessage(translateAuthError(res.error), true); return; }
      if (authMode === "signup" && !res.data.session) {
        setAuthMode("signin");
        showAuthMessage("Fast geschafft: Wir haben dir eine Bestätigungs-E-Mail geschickt. Bitte bestätige deine Adresse und melde dich danach an.", false);
      }
      /* Bei erfolgreichem Login/Registrierung mit sofortiger Session übernimmt
         onAuthStateChange unten das Laden der Daten und Umschalten der Ansicht. */
    }).finally(function () {
      submitBtn.disabled = false;
    });
  });

  document.getElementById("btn-logout").addEventListener("click", function () {
    sb.auth.signOut();
  });

  async function loadUserData(user) {
    showScreen("loading");
    document.getElementById("loading-text").textContent = "Daten werden geladen …";
    try {
      state = await loadRemoteState(user.id);
    } catch (e) {
      document.getElementById("loading-text").textContent = "Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.";
      var existingRetry = document.getElementById("loading-retry");
      if (!existingRetry) {
        var retry = document.createElement("button");
        retry.type = "button";
        retry.id = "loading-retry";
        retry.className = "btn-reset";
        retry.textContent = "Erneut versuchen";
        retry.addEventListener("click", function () { window.location.reload(); });
        document.getElementById("loading-screen").appendChild(retry);
      }
      return;
    }
    currentUserId = user.id;
    document.getElementById("account-email").textContent = user.email || "";
    buildRechner(state);
    render();
    subscribeRealtime(user.id);
    showScreen("app");
  }

  var lastHandledUserId = null;

  sb.auth.onAuthStateChange(function (event, session) {
    if (session && session.user) {
      if (lastHandledUserId === session.user.id) return;
      lastHandledUserId = session.user.id;
      loadUserData(session.user);
    } else {
      lastHandledUserId = null;
      unsubscribeRealtime();
      currentUserId = null;
      state = deepClone(DEFAULTS);
      document.getElementById("auth-email").value = "";
      setAuthMode("signin");
      showScreen("auth");
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js");
    });
  }
})();
</script>
